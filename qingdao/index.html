<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青岛·威海五日路线图</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://webapi.amap.com/loader.js"></script>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">QINGDAO · WEIHAI ROUTE</p>
          <h1 id="page-title">青岛·威海第一天路线图</h1>
          <p id="hero-text" class="hero-text"></p>
          <div class="hero-meta">
            <span id="day-meta"></span>
            <span id="stop-count"></span>
            <span id="day-theme"></span>
            <span><a href="./guide.html">打开景点图鉴</a></span>
            <span><a href="./tool.html">打开地点搜索工具</a></span>
            <span><a href="../index.html">返回目的地选择</a></span>
          </div>
        </div>
        <div class="hero-card">
          <h2>当天节奏</h2>
          <div id="weather-card" class="weather-card"></div>
          <ul id="day-overview" class="plain-list compact-list"></ul>
        </div>
      </section>

      <section class="dashboard">
        <aside class="sidebar">
          <div class="panel">
            <div class="panel-head">
              <h2 id="day-title"></h2>
              <p id="day-subtitle"></p>
            </div>
            <ol id="stop-list" class="stop-list"></ol>
          </div>

          <div class="panel emphasis">
            <div class="panel-head">
              <h2>当天提醒</h2>
              <p>国庆假期把时间留给路上与排队。</p>
            </div>
            <ul id="day-reminders" class="plain-list"></ul>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2>地点搜索</h2>
              <p>补充景点、停车场、入口或餐厅时，可搜索高德地点并复制坐标。</p>
            </div>
            <a class="tool-link" href="./tool.html">前往青岛地点搜索工具 <span>→</span></a>
          </div>
        </aside>

        <main class="map-stage">
          <div class="panel map-switch-panel">
            <div class="panel-head">
              <h2>行程切换</h2>
              <p>点击某一天，高亮当天路线与住宿。</p>
            </div>
            <div id="day-tabs" class="day-tabs"></div>
          </div>
          <div class="map-toolbar">
            <div>
              <strong id="map-route-name"></strong>
              <span id="map-route-summary"></span>
            </div>
            <button id="fit-route" type="button">聚焦当天路线</button>
          </div>
          <div class="map-canvas">
            <div id="map-stop-panel" class="map-stop-panel">
              <div class="map-stop-panel-head">
                <span>地点列表</span>
                <button id="toggle-map-stop-panel" class="map-stop-toggle" type="button">收起</button>
              </div>
              <div id="map-stop-list" class="map-stop-list"></div>
            </div>
            <div id="map"></div>
            <div id="map-hint" class="map-hint hidden"></div>
          </div>
        </main>
      </section>
    </div>
    <script src="./app.js?v=20261002-30"></script>
  </body>
</html>
