<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行目的地</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./landing.css" />
  </head>
  <body>
    <main class="landing-shell">
      <p class="eyebrow">TRAVEL PLANNER</p>
      <h1>选择一个目的地</h1>
      <p class="intro">从这里进入各城市的旅行攻略与地点搜索工具。</p>

      <section class="city-grid" aria-label="目的地列表">
        <a class="city-card xian" href="./xian/index.html">
          <span class="card-kicker">已有攻略</span>
          <h2>西安</h2>
          <p>四日游路线、行程提醒与地点管理。</p>
          <span class="card-action">打开西安攻略 <b>→</b></span>
        </a>
        <a class="city-card changsha" href="./changsha/index.html">
          <span class="card-kicker">Day 1 已上线</span>
          <h2>长沙</h2>
          <p>首日抵达、入住、咖啡与橘子洲路线。</p>
          <span class="card-action">打开长沙攻略 <b>→</b></span>
        </a>
      </section>
    </main>
  </body>
</html>
